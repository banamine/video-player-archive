<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Direct M4V Loader & Player</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #fff; margin: 20px; display: flex; gap: 20px; }
    .controls-panel { width: 35%; display: flex; flex-direction: column; gap: 10px; }
    .player-panel { width: 65%; display: flex; flex-direction: column; gap: 10px; }
    textarea { width: 100%; height: 150px; background: #222; color: #fff; border: 1px solid #444; padding: 10px; box-sizing: border-box; }
    button { background: #0084ff; color: white; border: none; padding: 12px; cursor: pointer; font-weight: bold; font-size: 14px; border-radius: 4px; }
    button:hover { background: #0066cc; }
    .video-list { max-height: 400px; overflow-y: auto; background: #222; border: 1px solid #444; border-radius: 4px; padding: 5px; }
    .video-item { padding: 10px; background: #333; margin-bottom: 5px; cursor: pointer; border-radius: 3px; font-size: 13px; }
    .video-item:hover { background: #444; }
    .video-item.active { background: #0084ff; font-weight: bold; }
    video { width: 100%; background: #000; border: 1px solid #444; border-radius: 4px; }
    h3 { margin: 0 0 5px 0; }
  </style>
</head>
<body>

  <!-- Left Side: Paste and Select -->
  <div class="controls-panel">
    <h3>1. Paste HTML Code Here</h3>
    <textarea id="htmlInput" placeholder="Paste the raw HTML text with the .m4v links here..."></textarea>
    <button id="loadBtn">⚡ Load & Extract Videos</button>
    
    <h3>2. Available Hours</h3>
    <div class="video-list" id="videoList">
      <div style="padding: 10px; color: #888;">No videos loaded yet. Paste source above and click Load.</div>
    </div>
  </div>

  <!-- Right Side: Live Video Player -->
  <div class="player-panel">
    <h3 id="playingTitle">Now Playing: None</h3>
    <video id="videoPlayer" controls autoplay></video>
  </div>

<script>
  const htmlInput = document.getElementById('htmlInput');
  const loadBtn = document.getElementById('loadBtn');
  const videoList = document.getElementById('videoList');
  const videoPlayer = document.getElementById('videoPlayer');
  const playingTitle = document.getElementById('playingTitle');

  loadBtn.addEventListener('click', () => {
    const rawHTML = htmlInput.value;
    if (!rawHTML.trim()) {
      alert("Please paste the HTML content first.");
      return;
    }

    // Create a temporary DOM element to parse the HTML string easily
    const parser = new DOMParser();
    const doc = parser.parseFromString(rawHTML, 'text/html');
    const links = doc.querySelectorAll('a[href*=".m4v"]');

    if (links.length === 0) {
      alert("No .m4v video links found in the text provided.");
      return;
    }

    // Clear list
    videoList.innerHTML = '';

    // Populate track items
    links.forEach((link, index) => {
      const url = link.getAttribute('href');
      const text = link.textContent.trim() || `Video ${index + 1}`;

      const item = document.createElement('div');
      item.className = 'video-item';
      item.innerText = text;
      
      // When clicked, push directly into browser native HTML5 video player element
      item.addEventListener('click', () => {
        // Manage active UI states
        document.querySelectorAll('.video-item').forEach(el => el.classList.remove('active'));
        item.classList.add('active');

        // Play video directly
        playingTitle.innerText = `Now Playing: ${text}`;
        videoPlayer.src = url;
        videoPlayer.load();
        videoPlayer.play().catch(e => console.log("Auto-play blocked or interrupted:", e));
      });

      videoList.appendChild(item);
    });

    // Auto-click the first video found to start playing immediately
    if (videoList.firstChild) {
      videoList.firstChild.click();
    }
  });
</script>
</body>
</html>
