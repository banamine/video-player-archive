<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AJN Hourly Video Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050508;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* Main Video Theater Stage */
    .main-stage {
      flex: 1;
      height: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .video-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
      padding: 20px;
      z-index: 10;
      pointer-events: none;
    }
    .video-title {
      font-size: 18px;
      font-weight: 700;
      color: #ff3333;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* Sidebar Archive Guide */
    .sidebar {
      width: 380px;
      height: 100%;
      background: #0f0f15;
      border-left: 1px solid #222230;
      display: flex;
      flex-direction: column;
      z-index: 20;
    }
    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid #222230;
    }
    .sidebar-header h2 {
      font-size: 18px;
      color: #fff;
      margin-bottom: 5px;
    }
    .archive-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }
    .archive-item {
      padding: 12px 14px;
      background: #151522;
      border-radius: 6px;
      margin-bottom: 8px;
      cursor: pointer;
      font-size: 13px;
      font-family: monospace;
      word-break: break-all;
      border-left: 3px solid transparent;
      transition: all 0.15s ease;
    }
    .archive-item:hover {
      background: #1c1c30;
    }
    .archive-item.active {
      background: #251818;
      border-left-color: #ff3333;
      color: #ff5555;
    }
    .sidebar-footer {
      padding: 15px;
      border-top: 1px solid #222230;
      background: #0b0b10;
    }

    /* Setup/Importer Screen Overlay */
    .setup-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0a0a0f;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .setup-card {
      background: #12121a;
      border: 1px solid #2b2b3a;
      border-radius: 12px;
      max-width: 500px;
      width: 100%;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .setup-card h3 { color: #ff3333; margin-bottom: 10px; font-size: 22px; }
    .setup-card p { color: #8a8a9e; font-size: 14px; margin-bottom: 20px; line-height: 1.4; }
    input[type="text"], textarea {
      width: 100%;
      background: #07070a;
      border: 1px solid #333344;
      color: #fff;
      padding: 12px;
      border-radius: 6px;
      font-family: monospace;
      margin-bottom: 15px;
      font-size: 13px;
    }
    textarea { height: 140px; resize: none; }
    .btn {
      width: 100%;
      background: #ff3333;
      color: #fff;
      border: none;
      padding: 12px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn:hover { background: #ff5555; }
    .btn-secondary { background: #2b2b3a; margin-top: 8px; }
    .btn-secondary:hover { background: #3b3b4a; }

    /* Layout Responsiveness */
    @media (max-width: 768px) {
      body { flex-direction: column; }
      .sidebar { width: 100%; height: 40%; }
    }
  </style>
</head>
<body>

  <!-- Video Window -->
  <div class="main-stage">
    <div class="video-header">
      <div class="video-title" id="currentVideoTitle">No Track Loaded</div>
    </div>
    <video id="mainPlayer" controls autoplay name="media"></video>
  </div>

  <!-- Selection Panel -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>AJN Hourly Log</h2>
      <div style="font-size: 11px; color: #666;" id="trackCounter">0 clips parsed</div>
    </div>
    <div class="archive-list" id="archiveList"></div>
    <div class="sidebar-footer">
      <button class="btn btn-secondary" style="padding: 8px; font-size: 12px;" id="changeSourceBtn">🔄 Load / Update Source File</button>
    </div>
  </div>

  <!-- Link Scraper Engine Interface -->
  <div class="setup-screen" id="setupScreen">
    <div class="setup-card">
      <h3>AJN Archive Link Scraper</h3>
      <p>Enter the archive HTML source file to extract the video timeline links directly into your browser.</p>
      
      <label style="font-size: 11px; font-weight: bold; color: #888;">TARGET INDEX URL:</label>
      <input type="text" id="sourceUrl" value="https://rss.alexjones.media/AJNHourlyVideo.html">
      <button class="btn" id="fetchDirectBtn">⚡ Attempt Direct Online Scan</button>
      
      <div style="text-align: center; margin: 15px 0; color: #444; font-size: 11px; font-weight: bold;">— OR IF BROWSER BLOCKS ACCESS (CORS) —</div>
      
      <label style="font-size: 11px; font-weight: bold; color: #888;">PASTE RAW HTML PAGE SOURCE CODE:</label>
      <textarea id="rawHtmlInput" placeholder="1. Open the URL in a separate browser window&#10;2. Right-click page -> select 'View Page Source'&#10;3. Press Ctrl+A to select all, Copy it, and paste it here..."></textarea>
      <button class="btn" id="parseRawBtn" style="background: #00bcd4;">🛠️ Extract .m4v Archives</button>
    </div>
  </div>

<script>
  let videoPlaylist = [];
  let currentTrackIndex = 0;
  let activeElementPointer = null;

  const player = document.getElementById('mainPlayer');
  const setupScreen = document.getElementById('setupScreen');
  const archiveListContainer = document.getElementById('archiveList');
  const videoTitleHeader = document.getElementById('currentVideoTitle');
  const trackCounterLabel = document.getElementById('trackCounter');

  // Extracts target video links out of strings/HTML structures
  function processHtmlPayload(htmlContent) {
    const matchedItems = [];
    
    // Pattern Matcher: Look for valid standard HTML href anchor nodes
    const virtualDoc = new DOMParser().parseFromString(htmlContent, 'text/html');
    const anchors = virtualDoc.querySelectorAll('a');
    
    anchors.forEach(anchor => {
      let urlValue = anchor.getAttribute('href');
      if (urlValue && (urlValue.toLowerCase().includes('.m4v') || urlValue.toLowerCase().includes('.mp4'))) {
        // Build out absolute address schema if relative references exist
        if (!urlValue.startsWith('http')) {
          urlValue = 'https://rss.alexjones.media/' + urlValue.replace(/^\//, '');
        }
        matchedItems.push({
          name: anchor.textContent.trim() || urlValue.substring(urlValue.lastIndexOf('/') + 1),
          streamUrl: urlValue
        });
      }
    });

    // Regex Fallback Pattern Scanner (for unformatted flat pages or partial trees)
    if (matchedItems.length === 0) {
      const stringRegex = /(https?:\/\/[^\s"'><]+?\.(?:m4v|mp4))/gi;
      let regularExpressionResult;
      while ((regularExpressionResult = stringRegex.exec(htmlContent)) !== null) {
        const discoveredUrl = regularExpressionResult[1];
        matchedItems.push({
          name: discoveredUrl.substring(discoveredUrl.lastIndexOf('/') + 1),
          streamUrl: discoveredUrl
        });
      }
    }

    if (matchedItems.length === 0) {
      alert("No valid .m4v or .mp4 media targets detected inside submitted payload.");
      return false;
    }

    videoPlaylist = matchedItems;
    localStorage.setItem('ajn_saved_playlist', JSON.stringify(videoPlaylist));
    generateUiList();
    setupScreen.style.display = 'none';
    executeTrack(0);
    return true;
  }

  // Layout Generator Loop
  function generateUiList() {
    archiveListContainer.innerHTML = '';
    trackCounterLabel.textContent = `${videoPlaylist.length} video streams ready`;
    
    const operationalFragment = document.createDocumentFragment();

    videoPlaylist.forEach((track, index) => {
      const itemRow = document.createElement('div');
      itemRow.className = 'archive-item';
      itemRow.setAttribute('data-id', index);
      itemRow.textContent = track.name;
      
      itemRow.onclick = () => {
        executeTrack(index);
      };
      
      operationalFragment.appendChild(itemRow);
    });

    archiveListContainer.appendChild(operationalFragment);
  }

  // Audio/Video Pipeline Interface Execution
  function executeTrack(index) {
    if (index < 0 || index >= videoPlaylist.length) return;
    currentTrackIndex = index;
    const selection = videoPlaylist[currentTrackIndex];

    videoTitleHeader.textContent = selection.name;

    // Fast O(1) state swapping logic
    if (activeElementPointer) {
      activeElementPointer.classList.remove('active');
    }
    const currentTargetNode = archiveListContainer.querySelector(`[data-id="${currentTrackIndex}"]`);
    if (currentTargetNode) {
      currentTargetNode.classList.add('active');
      activeElementPointer = currentTargetNode;
      currentTargetNode.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    // Direct Browser Progressive Native Injection Pipeline
    player.pause();
    player.src = selection.streamUrl;
    player.load();
    player.play().catch(error => {
      console.warn("Direct stream playback initialized or halted:", error);
    });
  }

  // Interactive Trigger Hooks
  document.getElementById('fetchDirectBtn').onclick = () => {
    const endpoint = document.getElementById('sourceUrl').value;
    fetch(endpoint)
      .then(response => response.text())
      .then(textData => {
        processHtmlPayload(textData);
      })
      .catch(err => {
        console.error(err);
        alert("The server blocked direct script access (CORS Security Policy). Please open the file in a new tab and paste its Page Source below instead.");
      });
  };

  document.getElementById('parseRawBtn').onclick = () => {
    const rawContentString = document.getElementById('rawHtmlInput').value;
    if (!rawContentString.trim()) {
      return alert("The raw data workspace is empty.");
    }
    processHtmlPayload(rawContentString);
  };

  document.getElementById('changeSourceBtn').onclick = () => {
    setupScreen.style.display = 'flex';
  };

  // Skip forward on video completion hook
  player.onended = () => {
    executeTrack((currentTrackIndex + 1) % videoPlaylist.length);
  };

  // Keyboard Navigation Bindings
  document.addEventListener('keydown', (event) => {
    if (setupScreen.style.display !== 'none') return;
    if (event.key === 'ArrowRight') executeTrack((currentTrackIndex + 1) % videoPlaylist.length);
    if (event.key === 'ArrowLeft') executeTrack((currentTrackIndex - 1 + videoPlaylist.length) % videoPlaylist.length);
  });

  // Local Storage Initialization Validation Check
  const localCache = localStorage.getItem('ajn_saved_playlist');
  if (localCache) {
    videoPlaylist = JSON.parse(localCache);
    generateUiList();
    setupScreen.style.display = 'none';
    executeTrack(0);
  }
</script>
</body>
</html>
